<style>
:root{--ink:#14213d;--sub:#56627e;--card:#ffffff;--acc:#ff5a1f;--acc2:#1d4ed8;--gold:#f5b301;--bad:#e11d48;
  --font:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#86cdf5;color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
a{color:inherit}
.hide{display:none!important}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.pill{font-weight:800;font-size:13px;background:rgba(255,255,255,.88);padding:7px 12px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.sp{flex:1}
.ic{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#title{justify-content:space-between;background:linear-gradient(rgba(255,255,255,.0) 40%,rgba(20,33,61,.35))}
/* タイトルロゴ：シルエット・30だんとび・サブタイトル帯を1枚の画像に（作り方は 私用/タイトル案3/01b/） */
.logo{margin-top:1.5vh;text-shadow:none;display:flex;flex-direction:column;align-items:center;width:100%}
.l1Title{margin:0;line-height:0}
.l1Mark{display:block;width:min(346px,94vw);height:auto}
/* タイトルのアニメーション：三段跳び（「3だんとび」・ホップ・ステップ・ジャンプ）→「0」が落ちてきて 30だんとび に → 帯のステップがどんどん増えて28個に。
   部品の絵を止まったロゴ（.l1Mark）の上に重ねて動かし、終わると止まったロゴだけに戻る。動きを減らす設定なら最初から止まったロゴ（私用/タイトル案3/01b/build_anim.js で作る） */
.l1Anim{position:relative;display:block}
.l1L{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.l1Anim.play{animation:l1shake 3.6s linear both}
.l1Anim.play .l1Mark{animation:l1still 3.6s step-end both}
.l1Anim.play .l1L{animation-duration:3.6s;animation-fill-mode:both;animation-timing-function:linear}
.l1Anim.play .l1-base{animation-name:l1on}
.l1Anim.play .l1-n3{animation-name:l1n3}
.l1Anim.play .l1-n0{animation-name:l1n0;transform-origin:var(--ox) var(--oy)}
.l1Anim.play .l1-trail3{animation-name:l1oldT}
.l1Anim.play .l1-trail30{animation-name:l1wipeT}
@keyframes l1still{0%{visibility:hidden}100%{visibility:visible}}
@keyframes l1on{0%,99.9%{opacity:1}100%{opacity:0}}
@keyframes l1n3{0%,25%{opacity:1;transform:translateX(var(--dx));animation-timing-function:cubic-bezier(.5,0,.2,1)}30.56%,99.9%{opacity:1;transform:none}100%{opacity:0}}
@keyframes l1n0{0%,25%{opacity:0;transform:scale(2.8) rotate(-8deg);animation-timing-function:cubic-bezier(.55,0,1,.45)}30.56%{opacity:1;transform:none}33.33%{transform:scale(1.06)}36.11%,99.9%{opacity:1;transform:none}100%{opacity:0}}
@keyframes l1shake{0%,30.56%{transform:none}31.94%{transform:translate(-3px,2px)}33.33%{transform:translate(3px,-2px)}34.72%{transform:translate(-2px,1px)}36.11%,100%{transform:none}}
@keyframes l1oldT{0%,80.56%{opacity:1}86.11%,100%{opacity:0}}
@keyframes l1wipeT{0%,44.44%{opacity:1;clip-path:inset(0 100% 0 0)}80.56%,99.9%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}
.l1Anim.play .l1-bs1{animation-name:l1bs1}
@keyframes l1bs1{0%,52.03%{opacity:1}52.04%,100%{opacity:0}}
.l1Anim.play .l1-bs2{animation-name:l1bs2}
@keyframes l1bs2{0%,52.03%{opacity:0}52.04%,57.20%{opacity:1}57.21%,100%{opacity:0}}
.l1Anim.play .l1-bs3{animation-name:l1bs3}
@keyframes l1bs3{0%,57.20%{opacity:0}57.21%,61.74%{opacity:1}61.75%,100%{opacity:0}}
.l1Anim.play .l1-bs5{animation-name:l1bs5}
@keyframes l1bs5{0%,61.74%{opacity:0}61.75%,65.91%{opacity:1}65.92%,100%{opacity:0}}
.l1Anim.play .l1-bs8{animation-name:l1bs8}
@keyframes l1bs8{0%,65.91%{opacity:0}65.92%,69.82%{opacity:1}69.83%,100%{opacity:0}}
.l1Anim.play .l1-bs12{animation-name:l1bs12}
@keyframes l1bs12{0%,69.82%{opacity:0}69.83%,73.54%{opacity:1}73.55%,100%{opacity:0}}
.l1Anim.play .l1-bs17{animation-name:l1bs17}
@keyframes l1bs17{0%,73.54%{opacity:0}73.55%,77.10%{opacity:1}77.11%,100%{opacity:0}}
.l1Anim.play .l1-bs22{animation-name:l1bs22}
@keyframes l1bs22{0%,77.10%{opacity:0}77.11%,80.55%{opacity:1}80.56%,100%{opacity:0}}
.l1Anim.play .l1-bs28{animation-name:l1bs28}
@keyframes l1bs28{0%,80.55%{opacity:0}80.56%,99.9%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l1Anim.play,.l1Anim.play img{animation:none!important}}
.tBest{margin-top:14px;display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px}
.logo .tBest{margin-top:8px;background:none;color:#14213d;font-size:13px;font-weight:900;font-style:italic;letter-spacing:.06em;padding:4px 16px;border-radius:0;position:relative;isolation:isolate}
.logo .tBest::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.92);transform:skewX(-12deg);z-index:-1}
.tBot{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.pri{background:var(--acc);color:#fff;font-weight:900;font-size:20px;border-radius:999px;padding:16px 0;width:100%;box-shadow:0 5px 0 #b8380b}
.pri:active{transform:translateY(3px);box-shadow:0 2px 0 #b8380b}
.row{display:flex;gap:10px;width:100%}
.sub{flex:1;background:rgba(255,255,255,.94);font-weight:800;font-size:15px;border-radius:999px;padding:12px 0;display:flex;align-items:center;justify-content:center;gap:6px}
.credit{font-size:11px;color:rgba(255,255,255,.9);font-weight:700}
.credit a,.ver a{color:inherit}
#result{justify-content:flex-end}
.sheet{width:min(440px,100%);background:var(--card);border-radius:22px;padding:14px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.rTier{font-weight:900;font-size:15px;color:var(--acc2)}
.rDist{font-size:50px;font-weight:900;font-style:italic;line-height:1.05;letter-spacing:-.01em}
.rDist small{font-size:22px;margin-left:3px}
.rNote{font-size:13px;color:var(--sub);font-weight:700;min-height:18px}
.rNew{color:var(--acc);font-weight:900}
.pips{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0}
.pips i{display:block;height:10px;border-radius:3px;background:#e5e8f0}
.stats{display:flex;gap:5px;margin:4px 0 12px}
.stats div{flex:1;text-align:center;background:#f2f4f9;border-radius:9px;padding:5px 2px;font-size:10px;color:var(--sub);font-weight:700;line-height:1.3}
.stats b{display:block;font-size:13px;color:var(--ink)}
.btns2{display:flex;gap:8px;margin-top:10px}
.btns2 button{flex:1;background:#eef1f7;font-weight:800;font-size:14px;border-radius:999px;padding:11px 0}
.btns2 .icb{flex:none;width:54px;padding:0;display:grid;place-items:center}
.btns2 button:disabled{opacity:.45}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(20,33,61,.92);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;z-index:20;text-align:center;pointer-events:none}
.modal{position:absolute;inset:0;background:rgba(20,33,61,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{position:relative;width:min(420px,100%);background:#fff;border-radius:20px;padding:18px 18px 30px}
.mbox h2{margin:0 0 10px;font-size:20px;font-weight:900;font-style:italic}
.steps{display:flex;flex-direction:column;gap:9px}
.st{display:flex;gap:10px;align-items:flex-start}
.st b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px}
.st div{font-size:14px;line-height:1.5}
.st small{display:block;color:var(--sub);font-size:12px}
.mnote{margin-top:12px;font-size:13px;color:var(--sub);line-height:1.6}
.close{margin-top:12px;text-align:center;font-weight:800;color:var(--acc)}
.ver{position:absolute;right:14px;bottom:9px;font-size:11px;color:var(--sub);font-weight:700}
.rk{margin:0 0 10px;padding:8px 10px;background:#f2f4f9;border-radius:12px}
.rkMsg{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;min-height:16px}
.rkMsg b{color:var(--ink)}
.rkRow{display:flex;gap:6px}
.rkRow input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:700;padding:8px 10px;border:1px solid #cfd5e3;border-radius:10px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.rkRow button{flex:none;background:var(--acc2);color:#fff;font-weight:900;font-size:14px;border-radius:10px;padding:0 16px}
.rkRow button:disabled{background:#aab3c5}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;background:#eef1f7;font-weight:800;font-size:14px;border-radius:999px;padding:8px 0}
.tabs button.on{background:var(--ink);color:#fff}
.rkList{max-height:min(56vh,460px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.rec{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #eef1f7}
.rec>b{flex:none;width:28px;text-align:center;font-size:15px;font-weight:900;color:var(--sub)}
.rec:nth-child(-n+3)>b{color:var(--gold)}
.rec span{flex:1;min-width:0;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.rec em{flex:none;font-style:italic;font-weight:900;font-size:16px}
.rec.me{background:#fff6d6;border-radius:8px}
.empty{text-align:center;color:var(--sub);font-weight:700;font-size:14px;padding:24px 0}
</style>
</head>

<script>

// （遠くへ跳んでも1回の跳びは1秒たらずで終わる）。x は踏切板の先端が 0
const VERSION = '0.11.1';
const P = {
  jumps: 30,                            // 跳ぶ回数（踏切から数えて）
  g: 9.81, hTake: 1.0,
  runDist: 22, runT: 2.0, runEnd: 0.3,  // 助走：距離／板までの実時間／板の前でのスロー（速さの割合）
  v0: 10, vMin: 6, vMax: 40,            // 29段目までの横の速さ m/s（競技場の中で少しずつ速くなる）
  th0: 16, thCombo: 0.6, thMax: 24,     // 踏み切る角度（度）。PERFECT が続くほど上がる
  gain: [0.03, 0.02, 0.005, -0.04],     // 判定ごとの加速（PERFECT／GREAT／GOOD／BAD）
  miss: -0.08,                          // 押せなかったとき
  pts: [1, 0.6, 0.3, 0, 0],             // 判定ごとに溜まるパワー
  comboPts: 0.05, comboMax: 20,         // PERFECT の連続でパワーが増える割合（上限まで）
  powA: 0.064, powP: 1.7,               // 最後のジャンプの倍率 = 2 + powA × パワー^powP
  finalQ: [1, 0.75, 0.5, 0.3, 0.2],     // 最後の踏み切りの判定で倍率に掛ける値
  thFinal: 40,                          // 最後のジャンプの角度（度）
  blastT: 0.55,                         // 最後の踏み切りの「溜め」（時間を止めて力を溜める秒数）
  perf: 0.045, zero: 0.22, early: 0.35, // 判定：ここまで満点／ここで0点（秒）／これより早いタップは「早すぎ」
  just: 0.015, justBoost: 0.03,         // 白い線ぴったり（±この秒）は JUST。1回ごとに最後の倍率を +この割合
  bar0: 1.25, bar1: 0.95,               // ゲージの針が端から端まで動く実時間（最初→29段目。だんだん速く）
  peakMin: 0.3, peakMax: 0.78,          // ゲージのピーク（ちょうど着く瞬間）の位置。毎回この間のどこか
  minLead: 0.6,                         // 針が動き出してからピークまでの最短の実時間（手前のピークは針をゆっくりにする）
  fTFinal: 4.5,                         // 最後のジャンプの実時間
  fEase: 0.35, fEaseFinal: 0.2,         // 着地前のスロー（着地の瞬間の進み方の割合）

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function qOf(e, perf, zero) { const a = Math.abs(e); return a <= perf ? 1 : a >= zero ? 0 : 1 - (a - perf) / (zero - perf); }
function gradeIdx(q) { return q >= 0.95 ? 0 : q >= 0.7 ? 1 : q >= 0.35 ? 2 : 3; }
const GRADES = ['PERFECT', 'GREAT', 'GOOD', 'BAD', 'MISS'];
function barT(n) { return P.bar0 + (P.bar1 - P.bar0) * clamp((n - 1) / (P.jumps - 2), 0, 1); }
function flightEase(u, fin) { const e = fin ? P.fEaseFinal : P.fEase; return e * u + (1 - e) * (1 - (1 - u) * (1 - u)); }
const powerMul = c => 2 + P.powA * Math.pow(c, P.powP);
function runPos(u) { return P.runEnd * u + (1 - P.runEnd) * (1 - (1 - u) * (1 - u)); }   // 助走：最初速く、板の前でゆっくり

function newGame(seed) {
  return { seed, st: 'ready', rt: 0, x: -P.runDist, y: P.hTake, v: P.v0, vy: 0, n: 0, gait: 0,
    runR0: 0, takeR: 0, T: 1, D: 0.6, x0: 0, tdR: 0, pend: null,
    combo: 0, maxCombo: 0, perfects: 0, justs: 0, boost: 1, charge: 0, mul: 1, maxV: P.v0, judge: [], marks: [], mark: null, dist: null, landR: 0, ev: [],
    eid: 0, rs: seed >>> 0 || 1, peak: 0.5, peakNext: 0.5, bar: P.bar0 };

}

  let th;

    if (e.k === 'start') SFX.start();
    else if (e.k === 'step') SFX.step();
    else if (e.k === 'take') {
      if (e.fin) SFX.bigKick(); else SFX.take(e.gi, e.v);
      const sub = e.gi === 4 ? '減速' : e.gi === 3 ? (e.e < 0 ? '早い' : '遅い') : e.gi === 0 && e.combo > 1 ? e.combo + ' COMBO' : e.gi > 0 && e.gi < 3 ? (e.e < 0 ? '少し早い' : '少し遅い') : '';
      if (e.just) { SFX.just(); if (!e.fin) pop('JUST!', 'ブースト ×' + G.boost.toFixed(2), '#ff4fd8', 40); }
      else if (!e.fin) pop(GRADES[e.gi], sub, GCOLS[e.gi], e.gi === 0 ? 34 + Math.min(10, e.combo) : 28);
      const hp = athleteScreen(); burst(hp.x, GY, e.gi === 0 ? 10 : 5, ZONES[zoneAt(G.x)].near);
      if (e.gi === 0) flash = 0.35;
      if (!e.fin) {
        const lv = powLevel(powerMul(G.charge));
        if (lv > powLv) { powLv = lv; SFX.levelUp(); showBanner({ text: 'POWER UP!', sub: 'Lv' + lv + '　×' + powerMul(G.charge).toFixed(1) }); rings.push({ x: hp.x, y: hp.y, t0: performance.now(), col: POW_COL[lv], r: 120 }); }
        if (e.n === P.jumps - 1) { bannerQ = []; banner = { text: 'LAST!', sub: '最後の踏み切りで ばこーん', t0: performance.now(), dur: 900 }; SFX.riser(G.T, 0.12); }
      } else { bannerQ = []; banner = { text: '溜めて…', sub: (e.just ? 'JUST' : GRADES[e.gi]) + '　パワー ×' + (e.mul / Math.sqrt(G.boost)).toFixed(1) + (G.justs ? '　JUST ×' + G.boost.toFixed(2) : ''), t0: performance.now(), dur: P.blastT * 1000 }; SFX.charge(P.blastT); }
    }
    else if (e.k === 'td') SFX.step();
    else if (e.k === 'blast') {
      // ばこーん：真っ白・衝撃波・爆音
      SFX.boom(); SFX.cheer(1); bannerQ = []; banner = { text: 'ばこーん！！', sub: kmh(G.v) + ' km/h', t0: performance.now(), big: 1, dur: 1300 };
      shake = 26; flash = 1; flashCol = '255,255,255';
      const hp = athleteScreen(); burst(hp.x, GY, 60, '#ffd23f', 3); burst(hp.x, GY, 30, ZONES[0].near, 2.5);
      for (let i = 0; i < 3; i++) rings.push({ x: hp.x, y: GY - 20, t0: performance.now() + i * 90, col: '#ffffff', r: 420 });
      FIN.vs = 0; FIN.clouds = Array.from({ length: 18 }, () => ({ x: Math.random() * W * 1.5, h: 0.08 + Math.random() * 1.1, s: 0.6 + Math.random() * 0.9 }));
      FIN.stars = Array.from({ length: 70 }, () => [Math.random(), Math.random() * 0.75, Math.random()]);
    }
    else if (e.k === 'land') {
      const z = ZONES[zoneAt(G.mark)];
      if (z.far === 'sea') SFX.splash(); else SFX.sand();
      // 着弾：地面が割れて土煙、記録を数え上げてドン
      shake = 24; flash = 1; flashCol = '255,255,255'; SFX.impact();
      const hp = athleteScreen(); burst(hp.x, GY, 70, z.near, 3); burst(hp.x, GY, 30, '#ffffff', 2);
      for (let i = 0; i < 2; i++) rings.push({ x: hp.x, y: GY, t0: performance.now() + i * 120, col: '#ffffff', r: 380, flat: 1 });
      pop(z.far === 'sea' ? '着水！' : '着弾！', '', '#ffd23f');
      slam = { t0: performance.now() };
      setTimeout(() => { if (G.st === 'land' || G.st === 'done') { SFX.cheer(clamp(Math.log10(Math.max(10, G.dist)) / 5, 0.3, 1)); SFX.fanfare(); } }, 900);
    }
  }
  G.ev.length = 0;
}

// ----- カメラ -----
// 横：選手を画面の左寄りに。縦：地面はいつも同じ高さ、高く跳ぶほど引く。選手の絵は小さくなりすぎない
const AS = () => Math.max(cam.sc, SC0 * 0.62);
const sx = wx => (wx - cam.x) * cam.sc + W * 0.3;
const sy = alt => GY - alt * cam.sc;
// 最後の大跳躍の間は、世界の縮尺ではなく「高さの割合」で見せる（選手は大きいまま、地面が下に落ちていく）
const finale = () => G.n >= P.jumps && (G.rt >= G.takeR || G.st === 'land' || G.st === 'done');

  if (finale()) { const A = SC0 * 0.8, a = finA(); return { x: W * 0.32, y: GY - (RP ? RP.hip : 0.9) * A - a * (GY - 290), A }; }

    const apex = G.vy * G.vy / (2 * P.g), dist = G.v * G.D;
    return Math.min(SC0, (GY - 150 - 1.9 * SC0 * 0.62) / Math.max(0.5, apex), 4 * W / Math.max(1, dist));   // 高さが見えるように。着く場所は終わりぎわに入ってくる

  cam.x = G.st === 'land' || G.st === 'done' ? G.mark : G.x;

  if (finale()) {
    // 大跳躍：景色はとにかく速く流す。着く前にゆるめて、着いたら止まる
    const u = G.st === 'air' ? (G.rt - G.takeR) / G.T : 1;
    const tv = G.st === 'air' ? (1400 + 2600 * clamp(Math.log10(G.v / 30) / 1.6, 0, 1)) * (1 - 0.6 * Math.max(0, u - 0.7) / 0.3) : 0;

  const z = zoneAt(cam.x);

    if (mode === 'play' && z > 0) { showBanner({ text: ZONES[z].name + 'へ！', sub: fmtDist(ZONES[z].from) + ' 突破' }); SFX.fanfare(); }

// ----- 描く -----
function ik(fx, fy) {   // 腰を原点に、足先 (fx,fy) からひざを求める（ひざは前に曲がる）
  let d = Math.hypot(fx, fy); const mx = LEG * 2 * 0.999;
  if (d > mx) { fx *= mx / d; fy *= mx / d; d = mx; } if (d < 0.05) d = 0.05;

}

  const steps = [1, 2, 5]; let st = 1;

  ctx.font = `800 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let m = Math.ceil((cam.x - W * 0.3 / cam.sc) / st) * st; sx(m) < W + 40; m += st) {
    if (m <= 0) continue;

  let isBest = false;
  if (!best || d > best.d) { isBest = true; best = { d, at: Date.now(), p: G.perfects, j: G.justs }; store.set('best', best); bestUI(); }
  lastRes = { d, perfects: G.perfects, maxCombo: G.maxCombo, maxV: G.maxV, judge: G.judge.map(j => j.gi), isBest };
  $('rTier').textContent = tierOf(d);
  $('rDist').innerHTML = fmtDist(d).replace(/(m|km)$/, '<small>$1</small>');
  const nz = ZONES.find(z => z.from > d);
  $('rNote').innerHTML = isBest ? '<span class="rNew">自己ベスト更新！</span>' : nz ? `次の景色まで あと ${fmtDist(nz.from - d)}` : 'いちばん遠くまで来た！';
  $('rPips').innerHTML = G.judge.map(j => `<i style="background:${GCOLS[j.gi]}"></i>`).join('');
  $('rStats').innerHTML = [['PERFECT', G.perfects + ' / ' + P.jumps], ['JUST ×' + G.boost.toFixed(2), G.justs], ['最大コンボ', G.maxCombo], ['最高速', kmh(G.maxV) + 'km/h']].map(c => `<div>${c[0]}<b>${c[1]}</b></div>`).join('');
  $('result').classList.remove('hide');
  playLog('done'); rkOverUI(); makeCard();
}

// ----- 共有 -----
// 結果の種類は景色（ZONES と同じ並び）。URL には決まったキーだけを入れる（/k/キー が結果に合ったプレビューのページ）
const ZKEYS = ['stadium', 'city', 'farm', 'sea', 'desert', 'snow', 'horizon'];
const zKey = d => ZKEYS[zoneAt(d)];
const isPhone = () => matchMedia('(pointer:coarse)').matches;   // 端末の共有シートはスマホだけ（Windows の Chrome・Edge でも出てしまうため）
function shareLink() { return /^https?:$/.test(location.protocol) && lastRes ? location.origin + '/k/' + zKey(lastRes.d) : ''; }
function shareText() {   // 1行に1つ：記録／結果の名前／数字／ハッシュタグ（リンクはこのあとに付く）
  const r = lastRes; if (!r) return '';
  return `30段飛びで ${fmtDist(r.d)}達成！\n${tierOf(r.d)}！\nPERFECT ${r.perfects}/${P.jumps}　コンボ ${r.maxCombo}　最高速 ${kmh(r.maxV)}km/h\n#30段飛び`;
}
// 景色の絵（空・雲・遠くの景色・地面）。結果カードとプレビュー画像で使う。hz は地平線の高さ
function paintScene(x, w, h, zi, hz, sc) {
  const Z = ZONES[zi], g = x.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, Z.sky); g.addColorStop(1, '#d6effc');
  x.fillStyle = g; x.fillRect(0, 0, w, hz);
  x.fillStyle = 'rgba(255,255,255,.85)';
  for (const [cx, cy, r] of [[0.12, 0.16, 1], [0.46, 0.08, 0.7], [0.83, 0.2, 1.2]]) { const X = cx * w, Y = cy * hz, R = 34 * sc * r; x.beginPath(); x.ellipse(X, Y, R * 1.6, R * 0.55, 0, 0, 7); x.ellipse(X + R * 0.6, Y - R * 0.3, R, R * 0.6, 0, 0, 7); x.fill(); }
  const img = FAR[Z.far];
  if (img) { const iw = img.width / DPR * sc, ih = img.height / DPR * sc; for (let X = -iw * 0.3; X < w; X += iw) x.drawImage(img, X, hz - ih, iw, ih); }
  x.fillStyle = Z.band; x.fillRect(0, hz, w, 18 * sc);
  x.fillStyle = Z.near; x.fillRect(0, hz + 18 * sc, w, h - hz);
}
const logoImg = () => document.querySelector('.l1Mark');
// ロゴは白いにじみを付けて描く（観客席の上でも紺の文字が沈まないように）
function drawLogo(x, L, X, Y, w) { const h = w * L.naturalHeight / L.naturalWidth; x.save(); x.shadowColor = 'rgba(255,255,255,.95)'; x.shadowBlur = w * 0.05; x.drawImage(L, X, Y, w, h); x.drawImage(L, X, Y, w, h); x.restore(); x.drawImage(L, X, Y, w, h); }
function outlined(x, s, X, Y, size, col) {
  x.font = `900 italic ${size}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = size * 0.2; x.strokeStyle = '#14213d'; x.strokeText(s, X, Y); x.fillStyle = col; x.fillText(s, X, Y);
}
// 結果カード（投稿に付ける画像。1080×1080）
function cardCanvas() {
  const r = lastRes, c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
  const x = c.getContext('2d'), zi = zoneAt(r.d);
  paintScene(x, 1080, 1080, zi, 700, 2.2);
  const L = logoImg(); if (L && L.naturalWidth) drawLogo(x, L, 540 - 310, 40, 620);
  outlined(x, fmtDist(r.d), 540, 520, 170, '#ffd23f');
  outlined(x, tierOf(r.d), 540, 640, 54, '#fff');
  x.fillStyle = 'rgba(20,33,61,.82)'; x.fillRect(120, 790, 840, 200);
  x.font = `900 40px ${FONT}`; x.textAlign = 'center'; x.fillStyle = '#fff';
  x.fillText(`PERFECT ${r.perfects}/${P.jumps}　最高速 ${kmh(r.maxV)}km/h`, 540, 845);
  const n = r.judge.length, w = 760 / n;
  r.judge.forEach((gi, i) => { x.fillStyle = GCOLS[gi]; x.fillRect(160 + i * w, 900, w - 5, 52); });
  return c;
}
// プレビュー画像（リンクを貼ったときに出る 1200×630。私用/計測/ogp.js が og/ に書き出す）。左下は X がドメイン名を重ねるので空ける
function ogCanvas(zi) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
  const x = c.getContext('2d');
  paintScene(x, 1200, 630, Math.max(0, zi), 470, 1.25);
  const L = logoImg(); if (L && L.naturalWidth) { const lw = zi < 0 ? 700 : 560; drawLogo(x, L, 600 - lw / 2, zi < 0 ? 40 : 20, lw); }
  if (zi >= 0) outlined(x, tierOf(ZONES[zi].from < 0 ? 0 : ZONES[zi].from), 600, 440, 66, '#ffd23f');
  else outlined(x, 'どこまで跳べる？', 600, 520, 56, '#fff');
  return c;
}
let card = null;   // {blob, file}：結果を出した時点で作る。でき上がるまで共有・保存は押せない
function makeCard() {
  card = null; $('bX').disabled = $('bImg').disabled = true;
  cardCanvas().toBlob(b => {
    if (!b) return;
    const n = store.get('imgN', 0) + 1; store.set('imgN', n);
    card = { blob: b, file: new File([b], `30だんとび_記録_${String(n).padStart(4, '0')}.png`, { type: 'image/png' }) };
    $('bX').disabled = $('bImg').disabled = false;
  }, 'image/png');
}
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 3200); }
const canShareFile = () => { try { return isPhone() && card && navigator.canShare && navigator.canShare({ files: [card.file] }); } catch (e) { return false; } };
function download() { const a = document.createElement('a'); a.href = URL.createObjectURL(card.blob); a.download = card.file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
// 共有：スマホは画像つきの共有シート（リンクは本文の最後に）、それ以外は X の投稿画面＋画像をクリップボードへ
function share() {
  const link = shareLink();
  if (canShareFile()) { navigator.share({ files: [card.file], text: shareText() + (link ? '\n' + link : '') }).catch(e => { if (e.name !== 'AbortError') openX(); }); return; }
  openX();
}
function openX() {
  const link = shareLink(), u = 'https://x.com/intent/tweet?text=' + encodeURIComponent(shareText()) + (link ? '&url=' + encodeURIComponent(link) : '');
  try {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': card.blob })])
      .then(() => toast('画像をコピーしました。投稿の画面に貼り付けてください'), () => toast('画像は保存してから添付してください'));
  } catch (e) { toast('画像は保存してから添付してください'); }
  const w = window.open(u, '_blank'); if (w) w.opener = null; else location.href = u;
}
// 保存：スマホは共有シート（「画像を保存」で写真へ）、PC はダウンロード
function save() {
  if (!card) return;
  if (canShareFile()) { navigator.share({ files: [card.file] }).catch(e => { if (e.name !== 'AbortError') download(); }); return; }
  download();
}
$('bX').onclick = () => { if (card) share(); };
$('bImg').onclick = save;

// ----- 操作 -----
document.addEventListener('pointerdown', auInit, true);
function onTap(ts) {
  if (mode !== 'play') return;
  const now = performance.now();
  advance(ts > last && ts <= now ? ts : now);   // 押した瞬間まで進めてから押す
  if (G.st === 'ready') return;                 // 走り出しは自動
  if (G.st === 'run' || G.st === 'ground' || (G.st === 'air' && G.pend == null)) holdGauge();
  tap(G); handleEvents();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.timeStamp); });
document.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;   // なまえの入力中は操作にしない
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (mode === 'play') onTap(e.timeStamp); else if (mode === 'result') startPlay(); }
});
// ----- ランキングと集計（送るのは記録・PERFECT と JUST の数・なまえ・遊んだ回の数字だけ）-----
const ONLINE = /^https?:$/.test(location.protocol);
const hex = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => x.toString(16).padStart(2, '0')).join(''); };
function devId() {   // 端末番号（1人1件のため。ランダムな数字だけ）
  let d = store.get('dev', '');
  if (!/^[0-9a-f]{16}$/.test(d)) { d = hex(8); store.set('dev', d); }
  return d;
}
// 遊んだ回を送る。届かなかったら端末に控え、開いたとき・次が届いた直後に1件ずつ送り直す（7日 か 5回で捨てる）
async function postPlay(b) {   // 届いた（または中身が悪くて断られた）なら true
  try { const r = await fetch('/api/play', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b), keepalive: true }); return r.ok || r.status === 400; } catch (e) { return false; }
}
async function sendPlay(b) {
  if (await postPlay(b)) { setTimeout(flushPlays, 2500); return; }   // 連投の制限（2秒）があるので間を空ける
  const q = store.get('q', []); q.push({ b, at: Date.now(), n: 1 }); store.set('q', q.slice(-30));
}
async function flushPlays() {
  const q = store.get('q', []).filter(x => Date.now() - x.at < 7 * 864e5 && x.n < 5); store.set('q', q);
  if (!ONLINE || !q.length) return;
  const x = q[0], ok = await postPlay(x.b), q2 = store.get('q', []), i = q2.findIndex(y => y.b.e === x.b.e);
  if (i >= 0) { if (ok) q2.splice(i, 1); else q2[i].n++; store.set('q', q2); }
  if (ok && q2.length) setTimeout(flushPlays, 2500);
}
function playLog(why) {   // 1回の遊びが終わったとき（途中でやめた回も）
  if (!ONLINE || G.st === 'ready') return;
  const f = store.get('played', 0) ? 0 : 1; store.set('played', 1);   // その端末で初めて遊んだ回
  sendPlay({ e: hex(8), f, v: VERSION, l: { why, d: G.dist, p: G.perfects, j: G.justs, c: G.maxCombo, n: G.n, t: +G.rt.toFixed(1) } });
}
const RK_NAME = /^[ぁ-ゖァ-ヺー]{1,8}$/;
const rk = { data: null, per: 'day', busy: false };
function rkBtn(done) { $('rkGo').disabled = done; $('rkGo').textContent = done ? '登録ずみ' : '登録'; }
function rkOverUI() {   // 結果の画面の登録欄：自己ベストを出す（もう登録した自己ベストなら「登録ずみ」）
  const ok = ONLINE && best && best.p != null;
  $('rkBox').classList.toggle('hide', !ok);
  if (!ok) return;
  const done = store.get('rk_sent', null) === best.d;
  $('rkName').value = store.get('rk_name', ''); rkBtn(done);
  $('rkMsg').innerHTML = done ? '自己ベスト <b></b> は登録ずみ' : '自己ベスト <b></b> をランキングに登録';
  $('rkMsg').querySelector('b').textContent = fmtDist(best.d);
}
async function rkSubmit() {
  if (!best || best.p == null || rk.busy) return;
  const u = $('rkName').value.trim();
  if (u && !RK_NAME.test(u)) { $('rkMsg').textContent = 'なまえは ひらがな・カタカナ 8文字まで'; return; }
  store.set('rk_name', u); rk.busy = true; $('rkGo').disabled = true; $('rkMsg').textContent = '送っています…';
  const s = best.d;
  try {
    const res = await fetch('/api/rank', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ s, u, p: best.p, j: best.j, k: zKey(s), d: devId(), at: best.at }) });   // at：自己ベストを出した時刻（今日の一覧に入れるかどうか）
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.status);
    rk.data = j;
    if (j.id) { const ids = store.get('rk_ids', []); ids.unshift(j.id); store.set('rk_ids', ids.slice(0, 50)); }
    store.set('rk_sent', s);   // この自己ベストは送った（次に更新するまで「登録ずみ」）
    const pos = [j.dpos ? `今日 <b>${j.dpos}位</b>` : '', j.pos ? `全期間 <b>${j.pos}位</b>` : ''].filter(Boolean).join('　');
    $('rkMsg').innerHTML = j.id ? '登録しました！　' + pos : pos ? '自分のいちばんの記録は　' + pos : '100位に入りませんでした';
    rkBtn(true);
  } catch (e) {
    const m = String(e.message);
    $('rkMsg').textContent = m === 'invalid' ? 'なまえを変えてみてください' : m === 'busy' ? '少し待ってからもう一度' : 'つながりませんでした';
    $('rkGo').disabled = false;
  }
  rk.busy = false;
}
$('rkGo').onclick = rkSubmit;
$('rkName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); rkSubmit(); } });
async function rkLoad() {
  $('rkList').innerHTML = '<p class="empty">よみこみ中…</p>';
  try { const res = await fetch('/api/rank'); if (!res.ok) throw 0; rk.data = await res.json(); } catch (e) { rk.data = null; }
  rkList();
}
function rkList() {
  const box = $('rkList'); box.innerHTML = '';
  if (!rk.data || !rk.data[rk.per]) { box.innerHTML = '<p class="empty">ランキングにつながりませんでした</p>'; return; }
  const list = rk.data[rk.per], mine = new Set(store.get('rk_ids', []));
  if (!list.length) { box.innerHTML = '<p class="empty">まだだれもいません。一番のりしよう！</p>'; return; }
  list.forEach((e, i) => {
    const el = document.createElement('div'); el.className = 'rec' + (mine.has(e.id) ? ' me' : '');
    el.innerHTML = '<b></b><span><span class="nm"></span><small></small></span><em></em>';
    el.querySelector('b').textContent = i + 1; el.querySelector('.nm').textContent = e.u || 'ななし';
    el.querySelector('small').textContent = `PERFECT ${e.p}　JUST ${e.j}`; el.querySelector('em').textContent = fmtDist(e.s);
    box.append(el);
  });
}
$('bRank').classList.toggle('hide', !ONLINE);
$('bRank').onclick = () => { $('rank').classList.remove('hide'); rkLoad(); };
$('rank').onclick = () => $('rank').classList.add('hide');
$('rankBox').onclick = e => e.stopPropagation();   // 中を触っても閉じない
$('rkPers').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; rk.per = b.dataset.v;
  for (const x of $('rkPers').children) x.classList.toggle('on', x === b); rkList();
};
setTimeout(flushPlays, 3000);

$('bStart').onclick = startPlay;
$('bAgain').onclick = startPlay;
$('bTop').onclick = toTitle;
$('bQuit').onclick = () => { if (mode === 'play') playLog('quit'); toTitle(); };
$('bSnd').onclick = toggleSnd; $('bSnd2').onclick = toggleSnd;
$('bHow').onclick = () => $('howto').classList.remove('hide');
$('howto').onclick = () => { $('howto').classList.add('hide'); store.set('seen', 1); if (!logoPlayed) playLogo(); };
// タイトルのロゴ：三段跳び → 30段跳び のアニメーション（開いたとき1回。遊び方が出ているときは閉じてから）
let logoPlayed = false;
function playLogo() { const a = $('l1Anim'); logoPlayed = true; a.classList.remove('play'); void a.offsetWidth; a.classList.add('play'); }
if (!store.get('seen', 0)) $('howto').classList.remove('hide'); else playLogo();
document.addEventListener('visibilitychange', () => { last = performance.now(); prevNow = last; });
newAttempt();
requestAnimationFrame(frame);
</script>
