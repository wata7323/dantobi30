<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#86cdf5">
<title>30段跳び</title>
<style>
:root{--ink:#14213d;--sub:#56627e;--card:#ffffff;--acc:#ff5a1f;--acc2:#1d4ed8;--gold:#f5b301;--bad:#e11d48;
  --font:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#86cdf5;color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
a{color:inherit}
.hide{display:none!important}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.pill{font-weight:800;font-size:13px;background:rgba(255,255,255,.88);padding:7px 12px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.sp{flex:1}
.ic{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#title{justify-content:space-between;background:linear-gradient(rgba(255,255,255,.0) 40%,rgba(20,33,61,.35))}
/* タイトルロゴ：シルエット・30だんとび・サブタイトル帯を1枚の画像に（作り方は 私用/タイトル案3/01b/） */
.logo{margin-top:1.5vh;text-shadow:none;display:flex;flex-direction:column;align-items:center;width:100%}
.l1Title{margin:0;line-height:0}
.l1Mark{display:block;width:min(346px,94vw);height:auto}
.tBest{margin-top:14px;display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px}
.logo .tBest{margin-top:8px;background:none;color:#14213d;font-size:13px;font-weight:900;font-style:italic;letter-spacing:.06em;padding:4px 16px;border-radius:0;position:relative;isolation:isolate}
.logo .tBest::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.92);transform:skewX(-12deg);z-index:-1}
.tBot{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.pri{background:var(--acc);color:#fff;font-weight:900;font-size:20px;border-radius:999px;padding:16px 0;width:100%;box-shadow:0 5px 0 #b8380b}
.pri:active{transform:translateY(3px);box-shadow:0 2px 0 #b8380b}
.row{display:flex;gap:10px;width:100%}
.sub{flex:1;background:rgba(255,255,255,.94);font-weight:800;font-size:15px;border-radius:999px;padding:12px 0;display:flex;align-items:center;justify-content:center;gap:6px}
.credit{font-size:11px;color:rgba(255,255,255,.9);font-weight:700}
.credit a,.ver a{color:inherit}
#result{justify-content:flex-end}
.sheet{width:min(440px,100%);background:var(--card);border-radius:22px;padding:14px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.rTier{font-weight:900;font-size:15px;color:var(--acc2)}
.rDist{font-size:50px;font-weight:900;font-style:italic;line-height:1.05;letter-spacing:-.01em}
.rDist small{font-size:22px;margin-left:3px}
.rNote{font-size:13px;color:var(--sub);font-weight:700;min-height:18px}
.rNew{color:var(--acc);font-weight:900}
.pips{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0}
.pips i{display:block;height:10px;border-radius:3px;background:#e5e8f0}
.stats{display:flex;gap:5px;margin:4px 0 12px}
.stats div{flex:1;text-align:center;background:#f2f4f9;border-radius:9px;padding:5px 2px;font-size:10px;color:var(--sub);font-weight:700;line-height:1.3}
.stats b{display:block;font-size:13px;color:var(--ink)}
.btns2{display:flex;gap:8px;margin-top:10px}
.btns2 button{flex:1;background:#eef1f7;font-weight:800;font-size:14px;border-radius:999px;padding:11px 0}
.modal{position:absolute;inset:0;background:rgba(20,33,61,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{position:relative;width:min(420px,100%);background:#fff;border-radius:20px;padding:18px 18px 30px}
.mbox h2{margin:0 0 10px;font-size:20px;font-weight:900;font-style:italic}
.steps{display:flex;flex-direction:column;gap:9px}
.st{display:flex;gap:10px;align-items:flex-start}
.st b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px}
.st div{font-size:14px;line-height:1.5}
.st small{display:block;color:var(--sub);font-size:12px}
.mnote{margin-top:12px;font-size:13px;color:var(--sub);line-height:1.6}
.close{margin-top:12px;text-align:center;font-weight:800;color:var(--acc)}
.ver{position:absolute;right:14px;bottom:9px;font-size:11px;color:var(--sub);font-weight:700}
.rk{margin:0 0 10px;padding:8px 10px;background:#f2f4f9;border-radius:12px}
.rkMsg{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;min-height:16px}
.rkMsg b{color:var(--ink)}
.rkRow{display:flex;gap:6px}
.rkRow input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:700;padding:8px 10px;border:1px solid #cfd5e3;border-radius:10px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.rkRow button{flex:none;background:var(--acc2);color:#fff;font-weight:900;font-size:14px;border-radius:10px;padding:0 16px}
.rkRow button:disabled{background:#aab3c5}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;background:#eef1f7;font-weight:800;font-size:14px;border-radius:999px;padding:8px 0}
.tabs button.on{background:var(--ink);color:#fff}
.rkList{max-height:min(56vh,460px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.rec{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #eef1f7}
.rec>b{flex:none;width:28px;text-align:center;font-size:15px;font-weight:900;color:var(--sub)}
.rec:nth-child(-n+3)>b{color:var(--gold)}
.rec span{flex:1;min-width:0;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.rec em{flex:none;font-style:italic;font-weight:900;font-size:16px}
.rec.me{background:#fff6d6;border-radius:8px}
.empty{text-align:center;color:var(--sub);font-weight:700;font-size:14px;padding:24px 0}
</style>
</head>

    <button class="ic" id="bQuit" aria-label="やめる"></button>

  <div class="scr" id="title">

  th0: 16, thCombo: 0.6, thMax: 24,     // 踏み切る角度（度）。PERFECT が続くほど上がる

  just: 0.015, justBoost: 0.03,         // 白い線ぴったり（±この秒）は JUST。1回ごとに最後の倍率を +この割合
  bar0: 1.25, bar1: 0.95,               // ゲージの針が端から端まで動く実時間（最初→29段目。だんだん速く）

  pops = pops.filter(p => now - p.t0 < 800);
  if (G.st !== 'land' && G.st !== 'done') drawGauge(now, hudDt(now));
  drawPips();
}

// ----- タイミングゲージ -----
// 針は一定の速さで左から右へ流れる。ピーク（白い線）の位置は毎回変わり、針がピークに届いた瞬間が着く瞬間。色の帯は判定と同じ幅
let gHold = null;   // 押した瞬間のゲージ（針を止めて見せる）
const gView = { p: 0.5 };   // 表示しているピークの位置（新しい位置へすっと動かす）
function gaugeSpec() {
  const lab = G.n + 1 >= P.jumps ? '30段目　ばこーん！' : (G.n + 1) + '段目';
  if (G.st === 'ready' || G.st === 'run') return { label: '踏切', p: G.peak, bar: G.bar, left: G.st === 'run' ? boardR(G) - G.rt : 9, next: G.peakNext };
  if (G.st === 'air' && G.n < P.jumps) return { label: lab, p: G.peak, bar: G.bar, left: G.takeR + G.T - G.rt, next: G.n < P.jumps ? G.peakNext : null };
  if (G.st === 'ground') return { label: lab, p: G.peak, bar: G.bar, left: G.tdR - G.rt, next: G.n < P.jumps ? G.peakNext : null };
  return null;
}
function holdGauge() { const g = gaugeSpec(); if (g) gHold = Object.assign(g, { t0: performance.now() }); }
function drawGauge(now, rdt) {
  let g = gaugeSpec();
  const held = gHold && now - gHold.t0 < 260;
  if (held) g = gHold;
  if (!g) return;
  gView.p = held ? g.p : lerp(gView.p, g.p, 1 - Math.exp(-rdt * 25));
  const x0 = 24, x1 = W - 24, y = Math.round(H * 0.8), h = 28, cx = x0 + (x1 - x0) * gView.p;
  const pxs = (x1 - x0) / g.bar, mx = left => clamp(x0 + (x1 - x0) * g.p - left * pxs, x0, x1);   // 残り時間 → 横位置
  txt('TAP ▶ ' + g.label, x0, y - h / 2 - 15, 15, '#fff', '#14213d', 'left');
  ctx.fillStyle = 'rgba(20,33,61,.9)'; rr(x0 - 4, y - h / 2 - 4, x1 - x0 + 8, h + 8, 10); ctx.fill();
  ctx.save(); rr(x0, y - h / 2, x1 - x0, h, 7); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(x0, y - h / 2, x1 - x0, h);
  const w = q => P.perf + (1 - q) * (P.zero - P.perf);
  for (const [hw, c] of [[w(0.35), GCOLS[2]], [w(0.7), GCOLS[1]], [P.perf, GCOLS[0]]]) { ctx.fillStyle = c; ctx.fillRect(cx - hw * pxs, y - h / 2, hw * pxs * 2, h); }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.fillRect(cx - 1, y - h / 2 - 6, 2, h + 12);
  // 次の跳びのピーク（薄い印）。着いた瞬間に「次はどこか」が分かる
  if (g.next != null) {
    const nx = x0 + (x1 - x0) * g.next;
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(nx, y - h / 2 - 2); ctx.lineTo(nx, y + h / 2 + 2); ctx.stroke(); ctx.setLineDash([]);
    txt('NEXT', clamp(nx, x0 + 20, x1 - 20), y + h / 2 + 30, 11, '#fff', '#14213d');
  }
  const x = mx(g.left), blink = held && Math.floor(now / 70) % 2;
  ctx.fillStyle = blink ? '#ffd23f' : '#fff'; ctx.strokeStyle = '#14213d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.rect(x - 3, y - h / 2 - 8, 6, h + 16); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 8, y + h / 2 + 18); ctx.lineTo(x + 8, y + h / 2 + 18); ctx.lineTo(x, y + h / 2 + 9); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// 30段の結果の粒（下）
function drawPips() {
  const n = P.jumps, x0 = 24, x1 = W - 24, y = Math.round(H * 0.9), gap = 2, w = (x1 - x0 - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    const j = G.judge[i];
    ctx.fillStyle = j ? GCOLS[j.gi] : i === G.judge.length ? '#fff' : 'rgba(20,33,61,.35)';
    rr(x0 + i * (w + gap), y, w, 12, 3); ctx.fill();
  }
}

// ----- 1コマ -----
let prevNow = performance.now();
function frame(now) {
  const rdt = Math.min(0.1, (now - prevNow) / 1000); prevNow = now;
  if (mode === 'play') {
    if (G.st === 'ready' && autoGo && now >= autoGo) { autoGo = 0; last = now; tap(G); handleEvents(); }
    advance(now);
  } else last = now;
  smoothPose(rdt);
  updateCam(rdt);
  if (finale()) for (const c of FIN.clouds) { c.x -= FIN.vs * 0.5 * c.s * rdt; if (c.x < -200) { c.x = W + 100 + Math.random() * 300; c.h = 0.08 + Math.random() * 1.1; } }
  if (mode === 'play' && !finale() && G.st !== 'ready' && G.st !== 'run') {   // Lv が高いほど体から光の粒が出る
    const lv = powLevel(powerMul(G.charge));
    if (lv >= 2 && Math.random() < lv * 0.12) { const p = athleteScreen(); parts.push({ x: p.x + (Math.random() - 0.5) * p.A, y: p.y + (Math.random() - 0.3) * p.A, vx: -60 - Math.random() * 60, vy: -80 - Math.random() * 60, life: 0.5, t: 0, col: POW_COL[lv], r: 2 + Math.random() * 2, float: 1 }); }
  }
  for (const p of parts) { p.t += rdt; if (!p.float) p.vy += 500 * rdt; p.x += p.vx * rdt; p.y = Math.min(GY + 4, p.y + p.vy * rdt); }
  parts = parts.filter(p => p.t < p.life);
  shake = Math.max(0, shake - rdt * 30); flash = Math.max(0, flash - rdt * 1.6); if (flash === 0) flashCol = '255,236,150';
  drawScene(now);
  if (mode === 'play' && G.st === 'done') {
    if (!doneAt) doneAt = now;
    else if (now - doneAt > 200) showResult();
  }
  requestAnimationFrame(frame);
}

// ----- 試技の始まりと結果 -----
function newAttempt() {
  G = newGame((Math.random() * 2 ** 32) >>> 0); RP = null; pops = []; parts = []; banner = null; bannerQ = []; doneAt = 0; gHold = null; altLv = 0; rings = []; powLv = 0; slam = null; FIN.vs = 0;
  cam.x = G.x; cam.sc = SC0; cam.far = 0; cam.cloud = 0; cam.zone = cam.prevZone = 0; cam.fade = 1; kmhShown = 0;
}
function startPlay() {
  newAttempt(); mode = 'play'; last = performance.now(); autoGo = last + 700;   // すぐ走り出す
  $('title').classList.add('hide'); $('result').classList.add('hide'); $('hud').classList.remove('hide');
}
function toTitle() {
  mode = 'title'; newAttempt();
  $('result').classList.add('hide'); $('hud').classList.add('hide'); $('title').classList.remove('hide');
}
let lastRes = null;
function showResult() {
  mode = 'result';
  const d = G.dist;
  let isBest = false;
  if (!best || d > best.d) { isBest = true; best = { d, at: Date.now(), p: G.perfects, j: G.justs }; store.set('best', best); bestUI(); }
  lastRes = { d, perfects: G.perfects, maxCombo: G.maxCombo, maxV: G.maxV, judge: G.judge.map(j => j.gi), isBest };
  $('rTier').textContent = tierOf(d);
  $('rDist').innerHTML = fmtDist(d).replace(/(m|km)$/, '<small>$1</small>');
  const nz = ZONES.find(z => z.from > d);
  $('rNote').innerHTML = isBest ? '<span class="rNew">自己ベスト更新！</span>' : nz ? `次の景色まで あと ${fmtDist(nz.from - d)}` : 'いちばん遠くまで来た！';
  $('rPips').innerHTML = G.judge.map(j => `<i style="background:${GCOLS[j.gi]}"></i>`).join('');
  $('rStats').innerHTML = [['PERFECT', G.perfects + ' / ' + P.jumps], ['JUST ×' + G.boost.toFixed(2), G.justs], ['最大コンボ', G.maxCombo], ['最高速', kmh(G.maxV) + 'km/h']].map(c => `<div>${c[0]}<b>${c[1]}</b></div>`).join('');
  $('result').classList.remove('hide');
  playLog('done'); rkOverUI();
}

// ----- 共有 -----
function shareText() {
  const r = lastRes; if (!r) return '';
  return `30段跳びで ${fmtDist(r.d)}！（${tierOf(r.d)}）\nPERFECT ${r.perfects}／最高速 ${kmh(r.maxV)}km/h\n#30段跳び`;
}
function cardCanvas() {
  const r = lastRes, c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2b6fd6'); g.addColorStop(0.62, '#bfe6fb'); g.addColorStop(0.62, '#c85a3c'); g.addColorStop(0.7, '#c85a3c'); g.addColorStop(0.7, '#5aa957'); g.addColorStop(1, '#4e9c4a');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1080);
  const T = (s, X, Y, size, col) => { x.font = `900 italic ${size}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round'; x.lineWidth = size * 0.14; x.strokeStyle = '#14213d'; x.strokeText(s, X, Y); x.fillStyle = col; x.fillText(s, X, Y); };
  T('30段跳び', 540, 120, 96, '#fff');
  T(fmtDist(r.d), 540, 360, 200, '#ffd23f');
  T(tierOf(r.d), 540, 510, 56, '#fff');
  T(`PERFECT ${r.perfects}　最高速 ${kmh(r.maxV)}km/h`, 540, 600, 40, '#fff');
  const n = r.judge.length, w = 900 / n;
  r.judge.forEach((gi, i) => { x.fillStyle = GCOLS[gi]; x.fillRect(90 + i * w, 900, w - 6, 60); });
  return c;
}
$('bImg').onclick = async () => {
  cardCanvas().toBlob(async b => {
    const name = '30dantobi.png';
    try { const f = new File([b], name, { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: shareText() }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
};
$('bX').onclick = () => {
  const url = location.protocol.startsWith('http') ? location.origin + location.pathname : '';
  window.open('https://x.com/intent/post?text=' + encodeURIComponent(shareText()) + (url ? '&url=' + encodeURIComponent(url) : ''), '_blank', 'noopener');
};

// ----- 操作 -----
document.addEventListener('pointerdown', auInit, true);
function onTap(ts) {
  if (mode !== 'play') return;
  const now = performance.now();
  advance(ts > last && ts <= now ? ts : now);   // 押した瞬間まで進めてから押す
  if (G.st === 'ready') return;                 // 走り出しは自動
  if (G.st === 'run' || G.st === 'ground' || (G.st === 'air' && G.pend == null)) holdGauge();
  tap(G); handleEvents();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.timeStamp); });
document.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;   // なまえの入力中は操作にしない
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (mode === 'play') onTap(e.timeStamp); else if (mode === 'result') startPlay(); }
});
// ----- ランキングと集計（送るのは記録・PERFECT と JUST の数・なまえ・遊んだ回の数字だけ）-----
const ONLINE = /^https?:$/.test(location.protocol);
const hex = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => x.toString(16).padStart(2, '0')).join(''); };
function devId() {   // 端末番号（1人1件のため。ランダムな数字だけ）
  let d = store.get('dev', '');
  if (!/^[0-9a-f]{16}$/.test(d)) { d = hex(8); store.set('dev', d); }
  return d;
}
// 遊んだ回を送る。届かなかったら端末に控え、開いたとき・次が届いた直後に1件ずつ送り直す（7日 か 5回で捨てる）
async function postPlay(b) {   // 届いた（または中身が悪くて断られた）なら true
  try { const r = await fetch('/api/play', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b), keepalive: true }); return r.ok || r.status === 400; } catch (e) { return false; }
}
async function sendPlay(b) {
  if (await postPlay(b)) { setTimeout(flushPlays, 2500); return; }   // 連投の制限（2秒）があるので間を空ける
  const q = store.get('q', []); q.push({ b, at: Date.now(), n: 1 }); store.set('q', q.slice(-30));
}
async function flushPlays() {
  const q = store.get('q', []).filter(x => Date.now() - x.at < 7 * 864e5 && x.n < 5); store.set('q', q);
  if (!ONLINE || !q.length) return;
  const x = q[0], ok = await postPlay(x.b), q2 = store.get('q', []), i = q2.findIndex(y => y.b.e === x.b.e);
  if (i >= 0) { if (ok) q2.splice(i, 1); else q2[i].n++; store.set('q', q2); }
  if (ok && q2.length) setTimeout(flushPlays, 2500);
}
function playLog(why) {   // 1回の遊びが終わったとき（途中でやめた回も）
  if (!ONLINE || G.st === 'ready') return;
  const f = store.get('played', 0) ? 0 : 1; store.set('played', 1);   // その端末で初めて遊んだ回
  sendPlay({ e: hex(8), f, v: VERSION, l: { why, d: G.dist, p: G.perfects, j: G.justs, c: G.maxCombo, n: G.n, t: +G.rt.toFixed(1) } });
}
const RK_NAME = /^[ぁ-ゖァ-ヺー]{1,8}$/;
const rk = { data: null, per: 'day', busy: false };
function rkBtn(done) { $('rkGo').disabled = done; $('rkGo').textContent = done ? '登録ずみ' : '登録'; }
function rkOverUI() {   // 結果の画面の登録欄：自己ベストを出す（もう登録した自己ベストなら「登録ずみ」）
  const ok = ONLINE && best && best.p != null;
  $('rkBox').classList.toggle('hide', !ok);
  if (!ok) return;
  const done = store.get('rk_sent', null) === best.d;
  $('rkName').value = store.get('rk_name', ''); rkBtn(done);
  $('rkMsg').innerHTML = done ? '自己ベスト <b></b> は登録ずみ' : '自己ベスト <b></b> をランキングに登録';
  $('rkMsg').querySelector('b').textContent = fmtDist(best.d);
}
async function rkSubmit() {
  if (!best || best.p == null || rk.busy) return;
  const u = $('rkName').value.trim();
  if (u && !RK_NAME.test(u)) { $('rkMsg').textContent = 'なまえは ひらがな・カタカナ 8文字まで'; return; }
  store.set('rk_name', u); rk.busy = true; $('rkGo').disabled = true; $('rkMsg').textContent = '送っています…';
  const s = best.d;
  try {
    const res = await fetch('/api/rank', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ s, u, p: best.p, j: best.j, d: devId(), at: best.at }) });   // at：自己ベストを出した時刻（今日の一覧に入れるかどうか）
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.status);
    rk.data = j;
    if (j.id) { const ids = store.get('rk_ids', []); ids.unshift(j.id); store.set('rk_ids', ids.slice(0, 50)); }
    store.set('rk_sent', s);   // この自己ベストは送った（次に更新するまで「登録ずみ」）
    const pos = [j.dpos ? `今日 <b>${j.dpos}位</b>` : '', j.pos ? `全期間 <b>${j.pos}位</b>` : ''].filter(Boolean).join('　');
    $('rkMsg').innerHTML = j.id ? '登録しました！　' + pos : pos ? '自分のいちばんの記録は　' + pos : '100位に入りませんでした';
    rkBtn(true);
  } catch (e) {
    const m = String(e.message);
    $('rkMsg').textContent = m === 'invalid' ? 'なまえを変えてみてください' : m === 'busy' ? '少し待ってからもう一度' : 'つながりませんでした';
    $('rkGo').disabled = false;
  }
  rk.busy = false;
}
$('rkGo').onclick = rkSubmit;
$('rkName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); rkSubmit(); } });
async function rkLoad() {
  $('rkList').innerHTML = '<p class="empty">よみこみ中…</p>';
  try { const res = await fetch('/api/rank'); if (!res.ok) throw 0; rk.data = await res.json(); } catch (e) { rk.data = null; }
  rkList();
}
function rkList() {
  const box = $('rkList'); box.innerHTML = '';
  if (!rk.data || !rk.data[rk.per]) { box.innerHTML = '<p class="empty">ランキングにつながりませんでした</p>'; return; }
  const list = rk.data[rk.per], mine = new Set(store.get('rk_ids', []));
  if (!list.length) { box.innerHTML = '<p class="empty">まだだれもいません。一番のりしよう！</p>'; return; }
  list.forEach((e, i) => {
    const el = document.createElement('div'); el.className = 'rec' + (mine.has(e.id) ? ' me' : '');
    el.innerHTML = '<b></b><span><span class="nm"></span><small></small></span><em></em>';
    el.querySelector('b').textContent = i + 1; el.querySelector('.nm').textContent = e.u || 'ななし';
    el.querySelector('small').textContent = `PERFECT ${e.p}　JUST ${e.j}`; el.querySelector('em').textContent = fmtDist(e.s);
    box.append(el);
  });
}
$('bRank').classList.toggle('hide', !ONLINE);
$('bRank').onclick = () => { $('rank').classList.remove('hide'); rkLoad(); };
$('rank').onclick = () => $('rank').classList.add('hide');
$('rankBox').onclick = e => e.stopPropagation();   // 中を触っても閉じない
$('rkPers').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; rk.per = b.dataset.v;
  for (const x of $('rkPers').children) x.classList.toggle('on', x === b); rkList();
};
setTimeout(flushPlays, 3000);

$('bStart').onclick = startPlay;
$('bAgain').onclick = startPlay;
$('bTop').onclick = toTitle;
$('bQuit').onclick = () => { if (mode === 'play') playLog('quit'); toTitle(); };
$('bSnd').onclick = toggleSnd; $('bSnd2').onclick = toggleSnd;
$('bHow').onclick = () => $('howto').classList.remove('hide');
$('howto').onclick = () => { $('howto').classList.add('hide'); store.set('seen', 1); };
if (!store.get('seen', 0)) $('howto').classList.remove('hide');
document.addEventListener('visibilitychange', () => { last = performance.now(); prevNow = last; });
newAttempt();
requestAnimationFrame(frame);
</script>
